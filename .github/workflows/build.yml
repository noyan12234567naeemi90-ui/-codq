
name: Build Auto Slot 9 Drop

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '16'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.3.3'

      - name: Extract source
        run: |
          mkdir source
          unzip -q AutoSlot9Drop-1.17-Fabric.zip -d source

      - name: Build JAR
        run: |
          cd source
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AutoSlot9Drop-JAR
          path: source/build/libs/*.jar
